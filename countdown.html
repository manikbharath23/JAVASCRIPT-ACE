<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
</head>
<body>
<h1 id="h1">10</h1>
<script>
let count=10;
let h1=document.getElementById("h1")
let timer=setInterval(()=>{
if(count===0){
h1.textContent="Timer Over"
clearInterval(timer);
}
else{
h1.textContent=count;
count--;
}
},1000)
</script>
</body>
</html>
